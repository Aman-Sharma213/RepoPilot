name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Hello! I appreciate your contribution.
            Regards,
            Aman Sharma — thanks for opening your first issue.
          pr-message: |
            Hello! I appreciate your contribution.
            Regards,
            Aman Sharma — thanks for opening your first pull request.
